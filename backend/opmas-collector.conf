; OPMAS-001 | Supervisor configuration
; Copy to /etc/supervisor/conf.d/opmas-collector.conf
; Then: sudo supervisorctl reread && sudo supervisorctl update

[program:opmas-collector]
command=python3 /opt/opmas/backend/main.py
directory=/opt/opmas/backend
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stderr_logfile=/var/log/opmas/collector-error.log
stdout_logfile=/var/log/opmas/collector-out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
