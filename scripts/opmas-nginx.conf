# OPMAS-001 | Nginx Configuration
# Copy to /etc/nginx/sites-available/opmas
# Then: sudo ln -s /etc/nginx/sites-available/opmas /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name opmas.local;   # replace with real hostname/IP

    ssl_certificate     /etc/ssl/certs/opmas.crt;
    ssl_certificate_key /etc/ssl/private/opmas.key;

    # ── React Frontend ────────────────────────────────────────────────────
    root /opt/opmas/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Laravel API ───────────────────────────────────────────────────────
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Soketi) ────────────────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    access_log  /var/log/nginx/opmas-access.log;
    error_log   /var/log/nginx/opmas-error.log;
}
